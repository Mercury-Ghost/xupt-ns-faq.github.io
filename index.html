<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>西邮计算机 · 新生 FAQ</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg-body: #f2f5fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f4ff;
            --bg-input: #ffffff;
            --text-primary: #0b1a33;
            --text-secondary: #1e2f4a;
            --text-muted: #4f6587;
            --text-link: #1a5cff;
            --border-light: #dfe6ef;
            --border-focus: #1a5cff;
            --shadow-card: 0 2px 12px rgba(0, 20, 40, 0.06);
            --shadow-hover: 0 4px 20px rgba(0, 20, 40, 0.10);
            --shadow-focus: 0 0 0 3px rgba(26, 92, 255, 0.15);
            --shadow-dropdown: 0 8px 30px rgba(0, 0, 0, 0.12);
            --accent-blue: #1a5cff;
            --accent-blue-bg: #eef4ff;
            --accent-blue-text: #1a5cff;
            --tag-bg: #eef4ff;
            --tag-text: #1a5cff;
            --divider: #e2e9f2;
            --code-bg: #f0f4fa;
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-bg: rgba(255, 255, 255, 0.75);
            --header-border: rgba(255, 255, 255, 0.3);
            --dropdown-bg: rgba(255, 255, 255, 0.92);
            --nav-link-color: var(--text-secondary);
            --nav-link-hover: var(--accent-blue);
            --nav-link-bg-hover: var(--accent-blue-bg);
        }

        [data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --bg-card-hover: #1c2333;
            --bg-input: #0d1117;
            --text-primary: #e6edf5;
            --text-secondary: #c9d4e0;
            --text-muted: #8b9aab;
            --text-link: #58a6ff;
            --border-light: #30363d;
            --border-focus: #58a6ff;
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.5);
            --shadow-focus: 0 0 0 3px rgba(88, 166, 255, 0.2);
            --shadow-dropdown: 0 8px 30px rgba(0, 0, 0, 0.5);
            --accent-blue: #58a6ff;
            --accent-blue-bg: #1c2a3a;
            --accent-blue-text: #58a6ff;
            --tag-bg: #1c2a3a;
            --tag-text: #58a6ff;
            --divider: #30363d;
            --code-bg: #1c2333;
            --header-bg: rgba(13, 17, 23, 0.82);
            --header-border: rgba(48, 54, 61, 0.4);
            --dropdown-bg: rgba(22, 27, 34, 0.94);
            --nav-link-color: var(--text-secondary);
            --nav-link-hover: var(--accent-blue);
            --nav-link-bg-hover: var(--accent-blue-bg);
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            padding-top: 72px;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 60px;
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 840px;
            margin: 0 auto;
        }

        /* ===== 固定毛玻璃标题栏 ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-bottom: 1px solid var(--header-border);
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: background var(--transition), border-color var(--transition);
            min-height: 60px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-width: 0;
        }

        .header-left .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .header-left .badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-blue-text);
            background: var(--accent-blue-bg);
            padding: 2px 10px;
            border-radius: 20px;
            -webkit-text-fill-color: var(--accent-blue-text);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .hamburger {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background 0.2s;
            color: var(--text-primary);
        }

        .hamburger:hover {
            background: var(--bg-card-hover);
        }

        .hamburger .bar {
            display: block;
            width: 22px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: var(--transition);
            transform-origin: center;
        }

        .hamburger.active .bar:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
        }

        .hamburger.active .bar:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .hamburger.active .bar:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--dropdown-bg);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid var(--header-border);
            border-radius: 12px;
            box-shadow: var(--shadow-dropdown);
            padding: 8px 0;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1001;
        }

        .dropdown-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .dropdown-menu .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--nav-link-color);
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 0;
        }

        .dropdown-menu .nav-link:hover,
        .dropdown-menu .nav-link:focus-visible {
            background: var(--nav-link-bg-hover);
            color: var(--nav-link-hover);
        }

        .dropdown-menu .nav-link .link-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .dropdown-menu .nav-link .link-text {
            flex: 1;
        }

        .dropdown-menu .nav-link .link-count {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0 8px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }

        .menu-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            border-color: var(--border-focus);
            transform: scale(1.02);
        }

        .theme-toggle .icon {
            font-size: 15px;
        }

        /* ===== 页面内容 ===== */
        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 24px;
            padding-left: 2px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 14px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .subtitle .count {
            background: var(--bg-card);
            padding: 0 10px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
        }

        .search-box {
            margin-bottom: 28px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 46px;
            font-size: 16px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
            -webkit-appearance: none;
            appearance: none;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .search-box input:focus {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-focus);
        }

        .search-box .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
            opacity: 0.6;
        }

        .search-box .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: none;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .search-box .clear-btn:hover {
            background: var(--bg-card-hover);
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        /* ===== Category ===== */
        .category {
            margin-bottom: 32px;
            animation: fadeUp 0.3s ease forwards;
            opacity: 0;
            transform: translateY(12px);
            scroll-margin-top: 90px;
        }

        .category:nth-child(1) { animation-delay: 0.02s; }
        .category:nth-child(2) { animation-delay: 0.04s; }
        .category:nth-child(3) { animation-delay: 0.06s; }
        .category:nth-child(4) { animation-delay: 0.08s; }
        .category:nth-child(5) { animation-delay: 0.10s; }
        .category:nth-child(6) { animation-delay: 0.12s; }
        .category:nth-child(7) { animation-delay: 0.14s; }
        .category:nth-child(8) { animation-delay: 0.16s; }
        .category:nth-child(9) { animation-delay: 0.18s; }
        .category:nth-child(10) { animation-delay: 0.20s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--divider);
            margin-bottom: 14px;
        }

        .category-header .cat-icon {
            font-size: 20px;
            line-height: 1;
        }

        .category-header .cat-name {
            flex: 1;
        }

        .category-header .cat-count {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0 12px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* ===== FAQ Item ===== */
        .faq-item {
            background: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: border var(--transition), box-shadow var(--transition), background var(--transition), transform 0.15s;
        }

        .faq-item:hover {
            border-color: var(--accent-blue);
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
            transform: translateY(-1px);
        }

        .faq-q {
            padding: 14px 18px;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            user-select: none;
            color: var(--text-primary);
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .faq-q .q-text {
            flex: 1;
        }

        .faq-q .arrow {
            font-size: 14px;
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-body);
            transition: background 0.2s, transform 0.3s;
        }

        .faq-item:hover .faq-q .arrow {
            background: var(--accent-blue-bg);
        }

        .faq-item.open .faq-q .arrow {
            transform: rotate(180deg);
            background: var(--accent-blue-bg);
            color: var(--accent-blue);
        }

        .faq-a {
            padding: 0 18px 18px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            display: none;
            border-top: 1px solid var(--divider);
            padding-top: 16px;
            animation: slideDown 0.25s ease forwards;
        }

        @keyframes slideDown {
            0% { opacity: 0.4; transform: translateY(-6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .faq-item.open .faq-a {
            display: block;
        }

        .faq-a strong,
        .faq-a b {
            color: var(--text-primary);
        }

        .faq-a .highlight {
            background: var(--accent-blue-bg);
            color: var(--accent-blue-text);
            padding: 0 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px 40px;
            color: var(--text-muted);
            display: none;
            animation: fadeUp 0.3s ease;
        }

        .empty-state .big-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--divider);
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 18px;
        }

        .footer a {
            color: var(--text-link);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { padding-top: 66px; padding-left: 12px; padding-right: 12px; }
            .header { padding: 8px 12px; min-height: 54px; }
            .header-left .logo { font-size: 18px; }
            .header-left .badge { font-size: 10px; padding: 0 8px; }
            .theme-toggle { font-size: 12px; padding: 3px 10px; }
            .theme-toggle .icon { font-size: 13px; }
            .subtitle { font-size: 14px; padding-left: 10px; }
            .faq-q { font-size: 14px; padding: 12px 14px; }
            .faq-a { font-size: 14px; padding: 0 14px 14px; }
            .category-header { font-size: 15px; }
            .search-box input { padding: 12px 14px 12px 40px; font-size: 15px; }
            .search-box .search-icon { left: 12px; font-size: 16px; }
            .dropdown-menu { min-width: 180px; right: -4px; }
        }

        @media (max-width: 480px) {
            .header { padding: 6px 10px; min-height: 48px; gap: 6px; }
            .header-left .logo { font-size: 16px; }
            .header-left .badge { font-size: 9px; padding: 0 6px; }
            .hamburger { padding: 4px 6px; }
            .hamburger .bar { width: 18px; height: 2px; }
            .theme-toggle { font-size: 11px; padding: 2px 8px; }
            .theme-toggle .icon { font-size: 12px; }
            .dropdown-menu { min-width: 160px; right: -6px; }
            .dropdown-menu .nav-link { padding: 8px 14px; font-size: 13px; }
            .faq-q { font-size: 13px; padding: 10px 12px; }
            .faq-a { font-size: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ===== 打印 ===== */
        @media print {
            .header { position: static; backdrop-filter: none; background: #fff; border-bottom: 1px solid #ccc; }
            .menu-wrapper { display: none; }
            .theme-toggle { display: none; }
            .search-box { display: none; }
            .faq-item { break-inside: avoid; border: 1px solid #ccc; }
            .faq-a { display: block !important; }
            .faq-q .arrow { display: none; }
            body { background: #fff; color: #000; padding: 20px; }
            .category { animation: none !important; opacity: 1 !important; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ===== 固定毛玻璃标题栏 ===== -->
        <header class="header" id="mainHeader">
            <div class="header-left">
                <span class="logo">&lt;/&gt; 新生 FAQ</span>
                <span class="badge">西邮 · 计算机学院</span>
            </div>
            <div class="header-actions">
                <div class="menu-wrapper">
                    <button class="hamburger" id="hamburgerBtn" aria-label="展开导航菜单" aria-expanded="false">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>
                    <nav class="dropdown-menu" id="dropdownMenu" aria-label="分类导航">
                        <!-- 由 JavaScript 动态生成 -->
                    </nav>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <span class="icon" id="themeIcon">🌙</span>
                    <span id="themeLabel">暗色</span>
                </button>
            </div>
        </header>

        <!-- ===== 页面内容 ===== -->
        <div class="subtitle">
            <span>2026 级 · 常见问题汇总 · 点击问题展开答案</span>
            <span class="count" id="totalCount">0 条</span>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索问题关键词（如：床、军训、校园卡）" aria-label="搜索常见问题" />
            <button class="clear-btn" id="clearBtn" aria-label="清空搜索">✕</button>
        </div>

        <div id="faqContainer"></div>
        <div class="empty-state" id="emptyState">
            <div class="big-icon">🔍</div>
            <p>没有找到匹配的问题<br />试试其他关键词吧</p>
        </div>

        <div class="footer">
            <span>💡 点击问题展开 · 持续更新</span>
            <span>📌 群文件同步更新</span>
            <span><a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ 回到顶部</a></span>
        </div>
    </div>

    <script>
        // ================================================================
        //  1. FAQ 数据（根据 2026 级最新文档整理，共 58 条）
        // ================================================================
        const faqData = [
            // ---------- 宿舍 ----------
            { category: "宿舍", q: "床的尺寸是多少？", a: "标准尺寸为 0.9m × 1.9m。个子高的同学可申请加长床，具体政策等开学通知。" },
            { category: "宿舍", q: "被子床垫是自己买还是学校发？", a: "自己准备。可提前网购寄到学校快递站，也可报到时自带。" },
            { category: "宿舍", q: "宿舍是几人间？上床下桌吗？", a: "标准 6 人间。2026 级计算机学院全部在东区，全部为上床下桌，每人配有衣柜，空间足够。" },
            { category: "宿舍", q: "床位怎么分？先到先得吗？", a: "学校后勤处统一分配。“我是萌新”系统只显示宿舍号，具体床位需到宿舍后查看贴好的姓名标签。" },
            { category: "宿舍", q: "能装床帘、蚊帐吗？", a: "可以。尺寸按 0.9×1.9m 购买，也可买可调节的款式。" },
            { category: "宿舍", q: "有独立卫浴吗？", a: "没有。卫生间在楼层公共区域，浴室整栋楼共用（一楼），均为独立隔间（一人一间）。宿舍有独立小阳台。" },
            { category: "宿舍", q: "有电梯吗？", a: "东区宿舍楼没有电梯。" },
            { category: "宿舍", q: "空调是租的吗？", a: "是的。租赁费和电费分开算。租赁费可按年或四年一次性交（四年套餐最划算），电费约 0.52 元/度（仅供参考）。空调电费单独计算。" },
            { category: "宿舍", q: "冬天有暖气吗？", a: "有暖气片，冬天不冷。没有地暖。" },
            { category: "宿舍", q: "限电吗？", a: "限电 2000W。吹风机、电煮锅等大功率电器会跳闸。电脑正常使用（6 台同时用都没问题）。" },
            { category: "宿舍", q: "宿舍几点关门？", a: "23:30 关门，6:00 开门（北京标准时间）。" },
            { category: "宿舍", q: "查寝吗？能夜不归宿吗？", a: "禁止夜不归宿。偶尔查寝，辅导员会提前通知。导员有系统预警，被抓到后果严重。" },
            { category: "宿舍", q: "柜子大不大？", a: "够用。正常衣物和日常用品都能装下，有些同学东西特别多的话可能有点挤。" },

            // ---------- 军训 ----------
            { category: "军训", q: "军训什么时候开始？多长时间？", a: "所有军训相关问题请等待学院通知。注意：近期有骗子以军训名义加群或收费，切勿轻信。" },

            // ---------- 学习 ----------
            { category: "学习", q: "大一有晚自习吗？", a: "有。时间一般为 19:00–20:50（部分班级到 21:00）。管理宽松，不影响他人即可。" },
            { category: "学习", q: "有早八或早自习吗？", a: "有早八（8:00 上课）。早自习安排等待通知，以课表为准。" },
            { category: "学习", q: "作业多吗？", a: "不多。一般是一段时间交一次。大一主要是高数作业和 C 语言上机作业，其他课也可能有小组汇报、录视频等。" },
            { category: "学习", q: "大一学什么编程语言？", a: "以 C 语言为基础。大数据专业大一上学期学 Python，其他专业 Python 不是专业课。" },
            { category: "学习", q: "实验班怎么考？考什么？", a: "笔试数学（60 分）+ 英语（40 分），通过后面试。只能报考一个实验班。内容偏高考知识（圆锥曲线等），难度适中。" },
            { category: "学习", q: "实验班考上了换宿舍吗？", a: "一般不换。保留原宿舍。" },
            { category: "学习", q: "新生需要什么配置的电脑？", a: "不玩游戏的话轻薄本完全够用。建议内存 16GB 及以上，存储 512GB 或 1TB。计科、软工、网络、大数据等专业大一阶段没有本质区别。" },
            { category: "学习", q: "上课需要带电脑吗？", a: "大部分课在机房上，用学校电脑。机房的 C 语言 IDE 是 dev c++，考试也用，建议提前熟悉。想用自己的电脑也可以，机房有插排。C 语言课一周带一两次即可。" },
            { category: "学习", q: "选课什么时候开始？", a: "大一第一学期没有选课。大一下或大二才开始，需修够学分。" },
            { category: "学习", q: "学校用什么学习平台？", a: "云达人（洗浴）、U校园 Ai 版（线上学习）、学习通（签到/任务）、步道乐跑（体育打卡）、体适能（体育选课/查成绩）、学信网（学位认证）。" },
            { category: "学习", q: "培养计划什么时候能看？", a: "开学后辅导员发，比网上搜到的详细得多。" },

            // ---------- 食堂与生活 ----------
            { category: "食堂与生活", q: "学校有几个食堂？", a: "东区 1 个（东升餐厅，两层），西区 2 个（含美食广场）。用微信/支付宝支付，不需要饭卡。" },
            { category: "食堂与生活", q: "食堂贵吗？", a: "正常。一般 10–15 元就能很好的解决。吃腻了可去学校斜对面商场或点外卖。" },
            { category: "食堂与生活", q: "生活费大概多少？", a: "看个人，饭菜正常，来了试一个月就知道。" },

            // ---------- 校园交通与环境 ----------
            { category: "校园交通与环境", q: "东西区离得远吗？", a: "步行约 20 分钟，有校内天桥连接。" },
            { category: "校园交通与环境", q: "能随便进出校门吗？", a: "白天自由进出。周末/节假日离校过夜需在“i西邮”小程序上请假，辅导员不卡人。平时离校不用请假。" },
            { category: "校园交通与环境", q: "能骑电动车或自行车吗？", a: "自行车可以。电动车有限制，建议别买。校内共享电动车（无共享自行车）。东区宿舍离教室近，走路就行。" },
            { category: "校园交通与环境", q: "图书馆要预约吗？", a: "不用，直接进。期末及四六级、考研前人较多。" },
            { category: "校园交通与环境", q: "学校有湖吗？有猫吗？", a: "图书馆旁有心形湖，养了很多咕咕和嘎嘎（鸭和鹅）。东区有很多哈基米（流浪猫），同学们可以喂养，可以撸，非常好玩。" },

            // ---------- 社团与实验室 ----------
            { category: "社团与实验室", q: "社团什么时候纳新？", a: "开学后两三周有“百团大战”式纳新，去西区旭日食堂门口那条路上转转就能看到。" },
            { category: "社团与实验室", q: "实验室怎么进？零基础能进吗？", a: "开学后会有宣讲+纳新，需报名+面试。主要考 C 语言基础（一般到链表）。所有实验室都考 C 语言。零基础现在开始学来得及。可通过黑马程序员、鹏哥 C 语言等自学。" },
            { category: "社团与实验室", q: "大一能进实验室吗？", a: "非常可以！完全可以！实验室主要面向大一纳新！！！欢迎各位的加入！" },

            // ---------- 团员与入党 ----------
            { category: "团员与入党", q: "团关系怎么转？现在要操作智慧团建吗？", a: "不急。开学后选完团支书、建立团支部后统一通知，现在不用操作智慧团建。一般 9 月底开始转。" },
            { category: "团员与入党", q: "团员档案袋没密封怎么办？", a: "联系高中团委。可自己买档案袋装入材料，由原团委在封口处盖章。未密封档案原则上不予接收。" },
            { category: "团员与入党", q: "不是团员有影响吗？大学能入团吗？", a: "不影响。大学可以入团，一般大一下有一批机会。" },
            { category: "团员与入党", q: "什么时候能入党？", a: "大一下可申请入党积极分子。每班约 3-4 个名额（具体等通知）。要先入团才能入党。" },

            // ---------- 报到与分班 ----------
            { category: "报到与分班", q: "报到带什么材料？", a: "档案袋（绝对不要拆封！）、录取通知书、身份证及复印件、准考证原件及复印件、团员档案（如有，密封）、证件照。具体以官方通知为准。" },
            { category: "报到与分班", q: "分班和宿舍分配什么时候知道？", a: "“西安邮电大学”公众号 → “我是萌新”系统查询。8 月中下旬开放（去年是 8 月 21 日）。分班后可在群里捞舍友。录取通知书编号在左下角。" },
            { category: "报到与分班", q: "能提前到校吗？能提前入住吗？", a: "可以参观校园（门卫看录取通知书或照片即可）。不能提前入住，报到当天才能进宿舍。" },
            { category: "报到与分班", q: "提前寄东西到学校地址写什么？", a: "陕西省西安市长安区西安邮电大学长安校区东区菜鸟驿站。快递可寄存一周以上，建议开学前一周左右寄出。快递点有四个，分班后选离宿舍近的。" },
            { category: "报到与分班", q: "证件照要什么尺寸和底色？", a: "一寸和二寸各 6-10 张左右，红底、蓝底、白底都备一些。保留好各种尺寸和底色的电子版。" },
            { category: "报到与分班", q: "需要买 U 盘吗？", a: "建议准备一个，16GB 或 32GB 即可，可以考虑双头的（type-C 和 USB 口都有），方便在手机、电脑等设备上插。" },
            { category: "报到与分班", q: "学费怎么交？什么时候交？", a: "“西安邮电大学”公众号 → “我是萌新”系统在线缴纳。系统未开放，等群里通知。" },

            // ---------- 防骗提醒 ----------
            { category: "防骗提醒", q: "群里有人自称老师加我好友？", a: "假的！本群官方老师只有黄中南老师和冯渤老师。所有老师和班助都不会私加好友或拉小群。凡自称老师私加你的，100% 是骗子！" },
            { category: "防骗提醒", q: "有人拉小群卖课/卖被子/办校园卡？", a: "全是骗局！常见套路：卖编程课、卖被子（六件套/九件套）、办校园卡、以助学贷款名义要求转账、冒充班助拉群。学校和班助不会在群里或私下收费。不确定时在群里 @各位班助 核实，不要转账！" },
            { category: "防骗提醒", q: "线上办校园卡能信吗？", a: "不要信！校园卡就是普通电话卡，非必须。重要提醒：自 2026 年 8 月 1 日起，第三方互联网渠道不再提供电信号卡办理服务，须通过运营商官方 App/官网或线下营业厅办理。" },
            { category: "防骗提醒", q: "有勤工俭学岗位吗？", a: "有，但务必认准辅导员在群里发的官方通知。" },

            // ---------- 其他 ----------
            { category: "其他", q: "银行卡办哪家的？", a: "学校无要求。如需申请助学金建议办农行卡（中国农业银行，学校附近有网点，可以开学后再办理）。录取通知书中没有银行卡，需自行办理。" },
            { category: "其他", q: "助学贷款/助学金需要提前开证明吗？", a: "助学贷款去当地教育局办。助学金开学后评选，有低保证、建档立卡等材料更好，非强制。注意：开学前不要轻信线上办理助学贷款的要求，学校不会通过私人微信/语音让学生操作。有骗子以此为由诈骗。" },
            { category: "其他", q: "档案袋能拆吗？封条松了怎么办？", a: "绝对不能拆！封条松了不要动里面东西，用胶水粘好即可。学校发的档案袋没密封的话，自己买档案袋由原团委在封口处盖章。" },
            { category: "其他", q: "校园卡是必须办的吗？", a: "不是。如果流量够用完全没必要办。" },
            { category: "其他", q: "节假日放假要请假吗？", a: "要。在“i西邮”小程序上做离校登记/请假，辅导员不卡人，只是确认谁离校谁留校。寒暑假也要做离校登记。" },
            { category: "其他", q: "有室内乒乓球场吗？", a: "室外有很多乒乓球台，室内有社团用的乒乓球场地。" },
            { category: "其他", q: "大一能申请外宿吗？", a: "有特殊情况（如身体原因）可以申请，需有相关医院证明。" }
        ];

        // 分类图标映射（与上面 category 字段完全对应）
        const categoryIcons = {
            "宿舍": "🏠",
            "军训": "🎖️",
            "学习": "📚",
            "食堂与生活": "🍜",
            "校园交通与环境": "🚌",
            "社团与实验室": "🧪",
            "团员与入党": "⭐",
            "报到与分班": "📦",
            "防骗提醒": "🔒",
            "其他": "📌"
        };

        // ================================================================
        //  2. 渲染 & 交互逻辑（保持不变）
        // ================================================================

        const container = document.getElementById('faqContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const totalCount = document.getElementById('totalCount');

        function render(items) {
            if (!items || items.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                totalCount.textContent = '0 条';
                return;
            }
            emptyState.style.display = 'none';
            totalCount.textContent = items.length + ' 条';

            const groups = {};
            items.forEach(item => {
                if (!groups[item.category]) groups[item.category] = [];
                groups[item.category].push(item);
            });

            let html = '';
            for (const [category, qs] of Object.entries(groups)) {
                const icon = categoryIcons[category] || '📌';
                const catId = `category-${category.replace(/\s/g, '')}`;
                html += `<div class="category" id="${catId}">`;
                html += `<div class="category-header">
                            <span class="cat-icon">${icon}</span>
                            <span class="cat-name">${category}</span>
                            <span class="cat-count">${qs.length}</span>
                        </div>`;
                qs.forEach((item, idx) => {
                    const uid = `faq-${category.replace(/\s/g, '')}-${idx}`;
                    html += `<div class="faq-item" id="${uid}" onclick="toggleItem('${uid}')">
                                <div class="faq-q">
                                    <span class="q-text">${item.q}</span>
                                    <span class="arrow">▾</span>
                                </div>
                                <div class="faq-a">${item.a}</div>
                            </div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        window.toggleItem = function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const isOpen = el.classList.contains('open');
            document.querySelectorAll('.faq-item.open').forEach(item => {
                if (item.id !== id) item.classList.remove('open');
            });
            if (isOpen) {
                el.classList.remove('open');
            } else {
                el.classList.add('open');
            }
        };

        function filterItems() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                render(faqData);
                clearBtn.classList.remove('visible');
                updateDropdownCounts();
                return;
            }
            clearBtn.classList.add('visible');
            const filtered = faqData.filter(item =>
                item.q.toLowerCase().includes(keyword) ||
                item.a.toLowerCase().includes(keyword) ||
                item.category.toLowerCase().includes(keyword)
            );
            render(filtered);
            updateDropdownCounts();
            if (filtered.length > 0) {
                document.querySelectorAll('.faq-item').forEach(el => el.classList.add('open'));
            }
        }

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.classList.remove('visible');
            render(faqData);
            updateDropdownCounts();
            searchInput.focus();
        });

        let searchTimer = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(filterItems, 150);
        });

        // ================================================================
        //  3. 汉堡菜单 + 下拉导航
        // ================================================================

        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        function getCategoryCounts() {
            const counts = {};
            faqData.forEach(item => {
                counts[item.category] = (counts[item.category] || 0) + 1;
            });
            return counts;
        }

        function buildDropdown() {
            const categories = [];
            const seen = new Set();
            faqData.forEach(item => {
                if (!seen.has(item.category)) {
                    seen.add(item.category);
                    categories.push(item.category);
                }
            });

            const counts = getCategoryCounts();
            let html = '';
            categories.forEach(cat => {
                const icon = categoryIcons[cat] || '📌';
                const catId = `category-${cat.replace(/\s/g, '')}`;
                const count = counts[cat] || 0;
                html += `
                    <a class="nav-link" href="#${catId}" data-category="${cat}">
                        <span class="link-icon">${icon}</span>
                        <span class="link-text">${cat}</span>
                        <span class="link-count">${count}</span>
                    </a>
                `;
            });
            dropdownMenu.innerHTML = html;

            dropdownMenu.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href').substring(1);
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        history.pushState(null, '', '#' + targetId);
                    }
                    closeDropdown();
                });
            });
        }

        function updateDropdownCounts() {
            const visibleItems = document.querySelectorAll('.category');
            const countMap = {};
            visibleItems.forEach(cat => {
                const header = cat.querySelector('.category-header .cat-name');
                const countEl = cat.querySelector('.category-header .cat-count');
                if (header && countEl) {
                    const name = header.textContent.trim();
                    countMap[name] = countEl.textContent.trim();
                }
            });
            dropdownMenu.querySelectorAll('.nav-link').forEach(link => {
                const catName = link.getAttribute('data-category');
                if (catName && countMap[catName]) {
                    const countSpan = link.querySelector('.link-count');
                    if (countSpan) countSpan.textContent = countMap[catName];
                }
            });
        }

        function toggleDropdown() {
            const isOpen = dropdownMenu.classList.toggle('open');
            hamburgerBtn.classList.toggle('active');
            hamburgerBtn.setAttribute('aria-expanded', isOpen);
        }

        function closeDropdown() {
            dropdownMenu.classList.remove('open');
            hamburgerBtn.classList.remove('active');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
        }

        hamburgerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.menu-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeDropdown();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDropdown();
            }
        });

        buildDropdown();
        render(faqData);
        updateDropdownCounts();

        window.addEventListener('load', function() {
            if (location.hash) {
                const target = document.getElementById(location.hash.substring(1));
                if (target) {
                    setTimeout(() => {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 300);
                }
            }
        });

        let resizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.innerWidth > 768) closeDropdown();
            }, 200);
        });

        // ================================================================
        //  4. 亮色/暗色主题切换
        // ================================================================

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        function getPreferredTheme() {
            const stored = localStorage.getItem('xupt-faq-theme');
            if (stored === 'dark' || stored === 'light') return stored;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('xupt-faq-theme', theme);
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeLabel.textContent = '亮色';
            } else {
                themeIcon.textContent = '🌙';
                themeLabel.textContent = '暗色';
            }
        }

        applyTheme(getPreferredTheme());

        themeToggle.addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        });

        const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
        darkModeMedia.addEventListener('change', function(e) {
            if (!localStorage.getItem('xupt-faq-theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        // ================================================================
        //  5. 键盘快捷键
        // ================================================================

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                clearBtn.classList.remove('visible');
                filterItems();
                searchInput.blur();
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT' && document.activeElement === searchInput) {
                searchInput.blur();
            }
        });

        console.log('✅ 西邮计算机学院 FAQ 已加载 (数据量: ' + faqData.length + ' 条)');
        console.log('💡 快捷键: Ctrl+K 搜索 | ESC 清空搜索');
    </script>
</body>
</html>
